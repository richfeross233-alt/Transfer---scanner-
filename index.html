
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfert Scanner</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
  color: #14213d;
}
.container {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 20px;
  text-align: center;
}
h1 { color: #0755c9; }
.card {
  padding: 18px;
  margin: 14px 0;
  border: 1px solid #ddd;
  border-radius: 12px;
}
button {
  width: 100%;
  padding: 15px;
  background: #0755c9;
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
}
input {
  width: 90%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>
<body>
<div class="container">
<h1>TRANSFERT SCANNER 🇨🇮</h1>
<p>Le transfert de crédit devient plus simple.</p>
<h3>Choisissez votre opérateur</h3>
<div class="card">
<h2>🟠 Orange</h2>
<button onclick="choisir('Orange')">Sélectionner</button>
</div>
<div class="card">
<h2>🟡 MTN</h2>
<button onclick="choisir('MTN')">Sélectionner</button>
</div>
<div class="card">
<h2>🔵 Moov</h2>
<button onclick="choisir('Moov')">Sélectionner</button>
</div>
<div class="card">
<h3 id="operateur">Votre opérateur</h3>
<input id="numero" placeholder="Numéro du destinataire">
<button onclick="verifier()">Vérifier le numéro</button>
<p id="resultat"></p>
</div>
</div>
<script>
let reseau = "";
function choisir(nom) {
  reseau = nom;
  document.getElementById("operateur").innerText = nom;
}
function verifier() {
  let numero = document.getElementById("numero").value.trim();
  if (!reseau || !/^[0-9]{10}$/.test(numero)) {
    document.getElementById("resultat").innerText =
      "Choisissez un opérateur et entrez un numéro valide de 10 chiffres.";
    return;
  }
  document.getElementById("resultat").innerText =
    "Numéro saisi : " + numero + " | Réseau : " + reseau;
}
</script>
</body>
</html>
